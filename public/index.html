<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Master - To-Do App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <div class="brand">
        <span style="font-size: 1.8rem;">✅</span>
        <h1>Task Master</h1>
      </div>
      <div id="account-controls" class="account-controls" hidden>
        <span id="account-name"></span>
        <button id="logout-button" class="theme-toggle" type="button">Log out</button>
      </div>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">🌙 Dark</button>
    </header>

    <div id="alert-box" class="alert alert-error" role="alert"></div>

    <section id="auth-panel" class="card auth-card">
      <h2 id="auth-title">Sign in</h2>
      <p id="auth-description">Sign in to see your private task list.</p>
      <form id="auth-form">
        <label for="auth-username">Username</label>
        <input id="auth-username" class="input-field" type="text" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" autocomplete="username" required>
        <label for="auth-password">Password</label>
        <input id="auth-password" class="input-field" type="password" minlength="12" maxlength="128" autocomplete="current-password" required>
        <button id="auth-submit" class="btn btn-primary" type="submit">Sign in</button>
      </form>
      <button id="auth-mode-toggle" class="auth-mode-toggle" type="button">Create an account</button>
      <p class="auth-note">Passwords must be at least 12 characters. Each account has its own tasks.</p>
    </section>

    <main id="tasks-card" class="card" hidden>
      <form id="task-form" class="todo-form">
        <input 
          type="text" 
          id="task-title" 
          class="input-field" 
          placeholder="What needs to be done?" 
          maxlength="255" 
          autocomplete="off" 
          required 
          aria-label="New task title"
        >
        <select id="task-priority" class="select-field" aria-label="Task priority">
          <option value="medium" selected>Priority: Medium</option>
          <option value="high">Priority: High</option>
          <option value="low">Priority: Low</option>
        </select>
        <button type="submit" class="btn btn-primary">➕ Add</button>
      </form>

      <div class="toolbar">
        <div class="search-box">
          <input 
            type="text" 
            id="search-input" 
            class="input-field" 
            placeholder="🔍 Search tasks..." 
            aria-label="Search tasks"
          >
        </div>

        <div class="filters-group" role="group" aria-label="Status filters">
          <button class="filter-btn active" data-status="all">All</button>
          <button class="filter-btn" data-status="active">Active</button>
          <button class="filter-btn" data-status="done">Completed</button>
        </div>

        <select id="filter-priority" class="select-field" aria-label="Filter by priority">
          <option value="all" selected>All Priorities</option>
          <option value="high">High Priority</option>
          <option value="medium">Medium Priority</option>
          <option value="low">Low Priority</option>
        </select>
      </div>

      <div class="status-bar">
        <span id="stats-count" class="stats-count">0 active • 0 completed</span>
        <button id="clear-completed" class="btn btn-danger">Clear Completed</button>
      </div>

      <ul id="task-list" class="todo-list"></ul>
    </main>

    <footer>
      <p id="footer-tip">Tip: Double-click any task title to edit it inline.</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
